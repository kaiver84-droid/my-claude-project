<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#bfe9ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>숫자 낚시 - 초등 1~4학년 수학 낚시 게임</title>
<style>
  :root{
    --ink:#0b3d5c;
    --ink-soft:#39647d;
    --sun:#ffcf3f;
    --sun-dark:#e0a200;
    --paper:#fffdf4;
    --panel:#ffffff;
    --line:#cbe7f5;
    --good:#2fb457;
    --bad:#f0736b;
    --blue:#2f8fd6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;width:100%;
    overflow:hidden;position:fixed;inset:0;
    background:#0b3d5c;
    font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    color:var(--ink);
    word-break:keep-all;
    -webkit-text-size-adjust:100%;
    -webkit-user-select:none;user-select:none;
    touch-action:manipulation;
  }
  #app{position:fixed;inset:0;overflow:hidden;}
  #scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  .hidden{display:none !important;}

  /* ---------- HUD ---------- */
  .hud{
    position:absolute;top:0;left:0;right:0;z-index:20;
    padding:calc(8px + env(safe-area-inset-top)) 10px 0 10px;
    display:flex;align-items:flex-start;gap:8px;pointer-events:none;
  }
  .hud-left{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 auto;min-width:0;}
  .chip{
    display:flex;align-items:baseline;gap:5px;
    background:rgba(255,255,255,.92);
    border:2px solid rgba(255,255,255,.9);
    border-radius:14px;padding:5px 10px;
    box-shadow:0 3px 10px rgba(6,50,74,.18);
    font-size:13px;font-weight:800;color:var(--ink);
    white-space:nowrap;line-height:1.2;
  }
  .chip .lbl{font-size:11px;font-weight:800;color:var(--ink-soft);}
  .chip b{font-size:17px;font-weight:900;letter-spacing:-.02em;}
  .chip.combo{background:linear-gradient(#fff3c9,#ffdf7a);border-color:#ffcf3f;}
  .chip.combo b{color:#a35a00;}
  .hud-right{display:flex;gap:6px;pointer-events:auto;}
  .icon-btn{
    width:44px;height:44px;border-radius:14px;border:2px solid rgba(255,255,255,.9);
    background:rgba(255,255,255,.92);color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 10px rgba(6,50,74,.18);
    cursor:pointer;padding:0;
  }
  .icon-btn svg{width:24px;height:24px;display:block;}
  .icon-btn:active{transform:scale(.94);}
  .icon-btn.off{opacity:.55;}

  /* ---------- timer ---------- */
  .timer{
    position:absolute;left:10px;right:10px;z-index:19;
    top:calc(58px + env(safe-area-inset-top));
    display:flex;align-items:center;gap:8px;pointer-events:none;
  }
  .timer .bar{
    flex:1 1 auto;height:12px;border-radius:99px;
    background:rgba(255,255,255,.55);overflow:hidden;
    box-shadow:inset 0 1px 3px rgba(6,50,74,.18);
  }
  .timer .bar i{
    display:block;height:100%;width:100%;border-radius:99px;
    background:linear-gradient(90deg,#5fd08a,#2fb457);
    transition:width .12s linear,background .3s;
  }
  .timer.low .bar i{background:linear-gradient(90deg,#ffb36b,#f0736b);}
  .timer .txt{
    font-size:13px;font-weight:900;color:#fff;
    text-shadow:0 1px 4px rgba(6,50,74,.5);
    min-width:44px;text-align:right;
  }
  .mode-pill{
    position:absolute;left:10px;top:calc(58px + env(safe-area-inset-top));z-index:19;
    display:flex;gap:6px;pointer-events:none;
  }
  .mode-pill span{
    background:rgba(11,61,92,.42);color:#fff;font-size:12px;font-weight:800;
    padding:4px 10px;border-radius:99px;backdrop-filter:blur(4px);
  }

  /* ---------- bottom bar ---------- */
  .bottom{
    position:absolute;left:0;right:0;bottom:0;z-index:20;
    padding:10px 12px calc(12px + env(safe-area-inset-bottom)) 12px;
    display:flex;gap:10px;align-items:flex-end;justify-content:center;
    pointer-events:none;
  }
  .cast-btn{
    pointer-events:auto;flex:0 1 340px;min-width:0;height:64px;
    border:none;border-radius:22px;
    background:linear-gradient(#ffd85a,#f0a800);
    color:#4a2c00;font-family:inherit;font-size:20px;font-weight:900;letter-spacing:-.01em;
    display:flex;align-items:center;justify-content:center;gap:8px;
    box-shadow:0 5px 0 #b88000, 0 12px 26px rgba(6,50,74,.28);
    cursor:pointer;
  }
  .cast-btn svg{width:28px;height:28px;}
  .cast-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b88000,0 6px 16px rgba(6,50,74,.25);}
  .cast-btn:disabled{opacity:.6;}
  .dex-btn{
    pointer-events:auto;width:78px;height:64px;border:3px solid #fff;border-radius:20px;
    background:rgba(255,255,255,.9);color:var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    font-family:inherit;font-size:11px;font-weight:900;
    box-shadow:0 5px 14px rgba(6,50,74,.22);cursor:pointer;
  }
  .dex-btn svg{width:26px;height:26px;}
  .dex-btn:active{transform:translateY(2px);}

  /* ---------- start screen ---------- */
  .screen{
    position:absolute;inset:0;z-index:30;
    display:flex;flex-direction:column;
    padding:calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
    overflow:hidden;
  }
  .start-top{display:flex;justify-content:flex-end;gap:6px;}
  .title-wrap{text-align:center;margin:4px 0 auto 0;pointer-events:none;}
  .title-wrap h1{
    display:inline-block;margin:0;padding:3px 20px 7px;
    font-size:clamp(27px,8.2vw,41px);font-weight:900;letter-spacing:-.03em;
    color:#fff;border-radius:18px;
    background:linear-gradient(180deg,#43b0d2,#1b7fa8);
    border:3px solid #fff;
    text-shadow:0 2px 0 rgba(6,50,74,.35);
    box-shadow:0 5px 0 #0e5b7c, 0 12px 26px rgba(6,50,74,.28);
  }
  .title-wrap p{
    margin:6px 0 0;font-size:13px;font-weight:800;color:#0b4a6b;
    background:rgba(255,255,255,.72);display:inline-block;padding:5px 12px;border-radius:99px;
  }
  .start-card{
    margin:10px auto 0;width:100%;max-width:430px;
    background:#fffdf4;
    border:3px solid #fff;border-radius:26px;
    padding:14px;box-shadow:0 14px 34px rgba(6,50,74,.3);
    max-height:calc(100% - 78px);overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  .seg-title{
    font-size:12px;font-weight:900;color:var(--ink-soft);letter-spacing:.02em;
    margin:2px 0 7px 3px;display:flex;align-items:center;gap:6px;
  }
  .seg-title::before{content:"";width:5px;height:12px;border-radius:3px;background:var(--sun-dark);}
  .level-list,.mode-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
  .grade-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px;}
  .opt{
    display:flex;align-items:center;gap:9px;text-align:left;
    min-height:50px;padding:7px 11px;border-radius:16px;
    background:#f2f9fd;border:2.5px solid #d7ecf6;
    font-family:inherit;color:var(--ink);cursor:pointer;width:100%;
  }
  .opt .num{
    flex:0 0 auto;width:29px;height:29px;border-radius:10px;background:#d9eef9;
    display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:#2f7ea6;
  }
  .opt .num svg{display:block;}
  .opt .txt{display:flex;flex-direction:column;gap:0;min-width:0;}
  .opt .txt b{font-size:16px;font-weight:900;letter-spacing:-.01em;line-height:1.15;}
  .opt .txt small{font-size:11px;font-weight:700;color:var(--ink-soft);line-height:1.2;}
  .opt.on{background:#fff7dc;border-color:var(--sun);box-shadow:0 0 0 2px rgba(255,207,63,.35) inset;}
  .opt.on .num{background:var(--sun);color:#5a3a00;}
  .opt:active{transform:scale(.99);}
  .grade-desc{
    font-size:11px;font-weight:700;color:#6b8fa3;line-height:1.35;
    margin:0 2px 10px;text-align:center;min-height:30px;
  }
  .best-line{
    font-size:12.5px;font-weight:800;color:#6d7f1f;background:#f4f9df;
    border-radius:10px;padding:6px 9px;margin:0 0 9px;text-align:center;line-height:1.3;
  }
  .big-btn{
    width:100%;height:60px;border:none;border-radius:20px;
    background:linear-gradient(#5ed08b,#2fb457);color:#fff;
    font-family:inherit;font-size:21px;font-weight:900;letter-spacing:-.01em;
    box-shadow:0 5px 0 #1d8340,0 12px 24px rgba(6,50,74,.25);cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .big-btn svg{width:26px;height:26px;}
  .big-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1d8340,0 6px 14px rgba(6,50,74,.22);}
  .ghost-btn{
    width:100%;height:46px;margin-top:8px;border:2.5px solid #d7ecf6;border-radius:16px;
    background:#fff;color:#2f7ea6;font-family:inherit;font-size:15px;font-weight:900;cursor:pointer;
  }
  .ghost-btn:active{transform:scale(.99);}

  /* ---------- modals ---------- */
  .modal{
    position:absolute;inset:0;z-index:40;
    display:flex;align-items:center;justify-content:center;
    padding:10px;
    background:rgba(8,45,68,.42);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  }
  .card{
    width:100%;max-width:460px;max-height:94vh;max-height:94dvh;
    background:var(--paper);border-radius:26px;border:3px solid #fff;
    box-shadow:0 18px 44px rgba(4,32,48,.4);
    padding:14px;display:flex;flex-direction:column;gap:10px;
    overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  .card.shake{animation:shake .42s;}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-9px) rotate(-.6deg)}
    40%{transform:translateX(8px) rotate(.6deg)}
    60%{transform:translateX(-6px)}
    80%{transform:translateX(4px)}
  }
  .quiz-top{display:flex;align-items:center;gap:8px;}
  .badge{
    flex:0 0 auto;width:76px;height:52px;border-radius:14px;background:#e8f6fd;
    display:flex;align-items:center;justify-content:center;overflow:hidden;border:2px solid #d3ecf9;
  }
  .badge canvas{width:76px;height:52px;display:block;}
  .quiz-top .say{flex:1 1 auto;min-width:0;}
  .quiz-top .say b{display:block;font-size:14.5px;font-weight:900;color:#1f6d94;line-height:1.3;}
  .quiz-top .say span{display:block;font-size:12px;font-weight:700;color:#7b93a3;margin-top:1px;}
  .qbox{
    background:#fff;border:2.5px solid #e6f2f8;border-radius:18px;
    padding:11px 8px;text-align:center;
  }
  .question{
    font-size:clamp(26px,8.6vw,40px);font-weight:900;letter-spacing:.01em;
    color:var(--ink);line-height:1.25;white-space:nowrap;
  }
  .question .blank{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:1.5em;height:1.22em;padding:0 .1em;margin:0 .04em;
    border:3px dashed #ffb703;border-radius:12px;background:#fff8e2;
    color:#d98a00;font-style:normal;vertical-align:-.12em;
  }
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .choice{
    min-height:60px;border-radius:16px;border:3px solid #bfe4f7;background:#fff;
    font-family:inherit;font-size:clamp(22px,7vw,30px);font-weight:900;color:#12506f;
    box-shadow:0 3px 0 #cfe8f4;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .08s,background .15s,border-color .15s;
  }
  .choice:active{transform:translateY(3px);box-shadow:none;}
  .choice.right{background:#e4f9ea;border-color:var(--good);color:#1b7a3c;box-shadow:0 3px 0 #a8e3bb;}
  .choice.wrong{background:#fdeceb;border-color:var(--bad);color:#c2453d;opacity:.75;box-shadow:0 3px 0 #f6c9c6;}
  .hint-btn{
    width:100%;min-height:46px;border-radius:14px;border:2.5px solid #ffd97a;
    background:#fff8e2;color:#a86a00;font-family:inherit;font-size:14.5px;font-weight:900;
    display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;
  }
  .hint-btn svg{width:20px;height:20px;}
  .hint-btn:active{transform:scale(.99);}
  .hint-panel{
    background:#fff;border:2.5px dashed #ffd97a;border-radius:16px;padding:10px 8px;
  }
  .hint-grid{
    display:grid;grid-template-columns:repeat(5,30px);gap:7px;justify-content:center;
  }
  .hint-grid.ten{grid-template-columns:repeat(10,24px);gap:4px;}
  .hint-ico{width:30px;height:30px;position:relative;display:block;}
  .hint-ico svg{width:30px;height:30px;display:block;}
  .hint-grid.ten .hint-ico,.hint-grid.ten .hint-ico svg{width:24px;height:24px;}
  .hint-ico.crossed{opacity:.38;}
  .hint-ico.crossed .x{position:absolute;inset:0;}
  .hint-ico.known::after{
    content:"";position:absolute;inset:-2px;border-radius:9px;
    border:2.5px solid #2f8fd6;box-shadow:0 0 0 2px rgba(47,143,214,.16);
  }
  .hint-note{
    margin:9px 2px 0;font-size:12.5px;font-weight:800;color:#7a6a3a;text-align:center;line-height:1.45;
  }
  /* 세로셈 / 단계별 풀이 */
  .colcalc{border-collapse:collapse;margin:4px auto 0;font-variant-numeric:tabular-nums;}
  .colcalc td{
    text-align:center;font-size:21px;font-weight:900;line-height:1.16;
    padding:0 1.5px;color:var(--ink);min-width:0.66em;letter-spacing:-.01em;
  }
  .colcalc td.sign{color:#2f8fd6;font-size:19px;padding-right:7px;padding-left:2px;}
  .colcalc tr.carry td{font-size:11.5px;line-height:1.05;color:#c2453d;height:14px;}
  .colcalc tr.ans td{border-top:2.5px solid #7b93a3;padding-top:4px;color:#1f6d94;}
  .hint-steps{margin:8px 2px 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;}
  .hint-steps li{display:flex;gap:7px;align-items:flex-start;}
  .hint-steps .n{
    flex:0 0 auto;width:19px;height:19px;border-radius:50%;background:#ffe6a8;color:#8a5a00;
    font-size:11.5px;font-weight:900;display:flex;align-items:center;justify-content:center;margin-top:1px;
  }
  .hint-steps .st{font-size:13px;font-weight:800;color:#45606f;line-height:1.45;letter-spacing:-.01em;}
  .hint-steps .st .eq{color:#1f6d94;font-weight:900;}
  .hint-steps .lab{
    display:inline-block;font-size:10.5px;font-weight:900;color:#a86a00;background:#fff3d1;
    border-radius:6px;padding:1px 5px;margin-right:5px;vertical-align:1px;
  }
  .feedback{
    min-height:20px;text-align:center;font-size:13.5px;font-weight:900;color:#c2453d;line-height:1.4;
  }
  .feedback.ok{color:#1b7a3c;}
  .quit-link{
    align-self:center;background:none;border:none;color:#9db2bf;font-family:inherit;
    font-size:12px;font-weight:800;text-decoration:underline;cursor:pointer;padding:6px;
  }

  /* ---------- dex ---------- */
  .dex-head{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .dex-head h2{margin:0;font-size:20px;font-weight:900;letter-spacing:-.02em;}
  .close-btn{
    width:40px;height:40px;border-radius:12px;border:2px solid #e0eef6;background:#fff;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:#5a7c8e;padding:0;
  }
  .close-btn svg{width:20px;height:20px;}
  .dex-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
  .stat{
    background:#fff;border:2px solid #eaf5fa;border-radius:13px;padding:7px 6px;text-align:center;
  }
  .stat small{display:block;font-size:10.5px;font-weight:800;color:#7b93a3;}
  .stat b{display:block;font-size:16px;font-weight:900;color:var(--ink);margin-top:1px;}
  .dex-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
  .dex-item{
    background:#fff;border:2px solid #eaf5fa;border-radius:14px;padding:6px 4px 7px;
    display:flex;flex-direction:column;align-items:center;gap:2px;
  }
  .dex-item canvas{width:72px;height:44px;display:block;}
  .dex-item .nm{font-size:11.5px;font-weight:900;color:var(--ink);}
  .dex-item .ct{font-size:11px;font-weight:800;color:#2f8fd6;}
  .dex-item.locked{background:#f4f8fa;border-style:dashed;}
  .dex-item.locked canvas{opacity:.28;filter:grayscale(1);}
  .dex-item.locked .nm{color:#9db2bf;}
  .dex-item.locked .ct{color:#b3c3cc;}
  .dex-legend{font-size:11.5px;font-weight:700;color:#7b93a3;text-align:center;line-height:1.5;}

  /* ---------- result ---------- */
  .result-card{max-width:400px;text-align:center;}
  .result-card h2{margin:2px 0 0;font-size:23px;font-weight:900;letter-spacing:-.02em;}
  .result-card .sub{margin:0;font-size:13px;font-weight:800;color:#7b93a3;}
  .big-score{
    font-size:52px;font-weight:900;color:#1f6d94;line-height:1.05;letter-spacing:-.03em;
    margin:4px 0 0;
  }
  .big-score small{font-size:18px;font-weight:900;color:#7b93a3;margin-left:3px;}
  .new-record{
    display:inline-block;background:linear-gradient(#ffe38a,#ffc93c);color:#7a4c00;
    font-size:12.5px;font-weight:900;padding:4px 12px;border-radius:99px;margin-top:2px;
  }
  .result-rows{display:flex;justify-content:center;gap:14px;font-size:13px;font-weight:800;color:#5a7c8e;}
  .result-rows b{color:var(--ink);font-size:16px;}
  .result-btns{display:flex;flex-direction:column;gap:8px;margin-top:2px;}

  /* ---------- toast ---------- */
  .toast{
    position:absolute;left:50%;top:calc(96px + env(safe-area-inset-top));z-index:35;
    transform:translate(-50%,-14px) scale(.94);
    background:rgba(255,255,255,.97);border:3px solid var(--sun);
    border-radius:18px;padding:9px 16px;
    box-shadow:0 10px 26px rgba(6,50,74,.3);
    display:flex;align-items:center;gap:9px;
    font-size:15px;font-weight:900;color:var(--ink);
    opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
    white-space:nowrap;max-width:92vw;
  }
  .toast.show{opacity:1;transform:translate(-50%,0) scale(1);}
  .toast .pts{color:#d98700;font-size:16px;}
  .toast canvas{width:44px;height:30px;flex:0 0 auto;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0;}

  @media (max-height:700px){
    .title-wrap h1{font-size:27px;}
    .title-wrap p{display:none;}
    .title-wrap{margin:2px 0 auto 0;}
    .start-card{padding:10px;border-radius:22px;}
    .opt{min-height:44px;padding:5px 9px;}
    .opt .txt b{font-size:15px;}
    .opt .txt small{font-size:10px;}
    .opt .num{width:26px;height:26px;border-radius:9px;font-size:13.5px;}
    .level-list,.mode-list{gap:5px;margin-bottom:8px;}
    .grade-grid{gap:5px;margin-bottom:5px;}
    .seg-title{margin-bottom:5px;}
    .grade-desc{min-height:26px;font-size:10.5px;margin-bottom:8px;}
    .big-btn{height:54px;font-size:19px;}
    .ghost-btn{height:42px;margin-top:6px;font-size:14px;}
    .best-line{padding:5px 8px;margin-bottom:7px;font-size:11.5px;}
    .cast-btn{height:58px;font-size:19px;}
    .dex-btn{height:58px;}
    .card{padding:11px;gap:8px;}
    .question{font-size:clamp(24px,7.8vw,34px);}
    .choice{min-height:54px;font-size:clamp(20px,6.6vw,26px);}
    .hint-btn{min-height:42px;font-size:13.5px;}
    .badge{width:64px;height:44px;}
    .badge canvas{width:64px;height:44px;}
    .hint-grid{grid-template-columns:repeat(5,26px);gap:5px;}
    .hint-ico,.hint-ico svg{width:26px;height:26px;}
    .hint-grid.ten{grid-template-columns:repeat(10,21px);gap:3px;}
    .hint-grid.ten .hint-ico,.hint-grid.ten .hint-ico svg{width:21px;height:21px;}
    .hint-note{font-size:11.5px;margin-top:7px;}
    .hint-steps .st{font-size:12px;}
    .colcalc td{font-size:18px;}
  }
  @media (max-height:560px){
    .title-wrap{display:block;margin:0 0 4px 0;}

<script>
"use strict";
/* =====================================================================
   숫자 낚시 - 초등학교 1~4학년 수학 낚시 게임
   단일 파일 / 외부 라이브러리 없음 / Canvas + CSS + Web Audio
   ===================================================================== */
(function(){

  /* =================================================================
     PROBLEM-ENGINE-START
     (이 구간은 순수 계산 코드만 담는다 — DOM 접근 없음.
      단위 감사 스크립트는 이 구간을 그대로 떼어 내 검증한다.)
     ================================================================= */
  const R = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
  const pick = (a) => a[Math.floor(Math.random()*a.length)];
  const clamp = (v,a,b) => Math.min(b,Math.max(a,v));
  function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  /* 한국어 조사 고르기 (받침 유무) */
  function hasBatchim(word){
    const c = word.charCodeAt(word.length-1);
    if(!(c >= 0xAC00 && c <= 0xD7A3)) return false;
    return (c - 0xAC00) % 28 !== 0;
  }
  function josa(word, withB, withoutB){ return word + (hasBatchim(word) ? withB : withoutB); }
  /* 숫자는 읽는 소리로 받침을 정한다: 0영·1일·3삼·6육·7칠·8팔·10십 … */
  const DIGIT_BATCHIM = {0:1,1:1,2:0,3:1,4:0,5:0,6:1,7:1,8:1,9:0};
  function numJosa(v, withB, withoutB){
    const s = String(v);
    const d = '0123456789'.indexOf(s.charAt(s.length-1));
    if(d < 0) return josa(s, withB, withoutB);
    return s + (DIGIT_BATCHIM[d] ? withB : withoutB);
  }

  const BLANK = '<i class="blank">?</i>';
  /* 소수 첫째 자리: 10분의 1 단위 정수(tenths) -> "1.9" (부동소수점 오차 없음) */
  function fmt10(t){ return Math.floor(t/10) + '.' + (t%10); }
  function fmtNum(n){ return String(n); }

  /* ---- 보기(4지선다) 만들기 ---- */
  const OFF_INT = [1,-1,2,-2,3,-3,5,-5,10,-10,20,-20,100,-100,9,-9,11,-11];
  const OFF_TEN = [1,-1,2,-2,3,-3,5,-5,10,-10,20,-20,30,-30,40,-40];

  function buildChoiceSet(ans, offs, min, max){
    const out = [ans];
    const sh = shuffle(offs.slice());
    for(let i=0;i<sh.length && out.length<4;i++){
      const v = ans + sh[i];
      if(v < min || v > max) continue;
      if(out.indexOf(v) !== -1) continue;
      out.push(v);
    }
    let guard = 0;
    const span = Math.max(2, Math.round(Math.abs(ans)*0.25));
    while(out.length < 4 && guard++ < 400){
      const v = ans + (Math.random()<0.5 ? -1 : 1) * R(1, span);
      if(v < min || v > max || out.indexOf(v) !== -1) continue;
      out.push(v);
    }
    let k = 1;
    while(out.length < 4){ const v = ans + k; if(v >= min && out.indexOf(v) === -1) out.push(v); k++; }
    return shuffle(out);
  }
  /* 정수 보기 4개 (문자열) */
  function numChoices(ans, opt){
    opt = opt || {};
    const min = opt.min != null ? opt.min : 0;
    const max = opt.max != null ? opt.max : Math.max(ans + 60, ans * 2 + 20);
    return buildChoiceSet(ans, opt.offs || OFF_INT, min, max).map(fmtNum);
  }
  /* 소수 첫째 자리 보기 4개 (10분의 1 정수 -> "1.9") */
  function decChoices(ansT, opt){
    opt = opt || {};
    const min = opt.min != null ? opt.min : 1;
    const max = opt.max != null ? opt.max : Math.max(ansT + 30, ansT * 2 + 10);
    return buildChoiceSet(ansT, opt.offs || OFF_TEN, min, max).map(fmt10);
  }

  /* ---- 힌트 구조 ----
     apples: {type:'apples', items:[{t:0|1|2, m:'none'|'crossed'|'known'}], note}
     steps : {type:'steps', col:null|{cols,rows}, steps:[{label,text}], note}
     세로셈 rows: {cls:'carry'|'ans'|'', sign:'+'|'-'|'', cells:['','4','7']} */
  function its(n, tone){
    const a = [];
    for(let i=0;i<n;i++) a.push({t: tone||0, m:'none'});
    return a;
  }
  function appleHint(items, note){ return {type:'apples', items, note: note || ''}; }
  function stepsHint(steps, note, col){ return {type:'steps', col: col || null, steps, note: note || ''}; }

  function padDigits(n, w){
    const s = String(n), out = [];
    for(let i=0;i<w-s.length;i++) out.push('');
    for(let i=0;i<s.length;i++) out.push(s[i]);
    return out;
  }
  function colAdd(a,b){
    const ans = a + b;
    const w = Math.max(String(a).length, String(b).length, String(ans).length);
    const carry = new Array(w).fill('');
    let c = 0;
    for(let i=w-1;i>=0;i--){
      const da = Math.floor(a / Math.pow(10, w-1-i)) % 10;
      const db = Math.floor(b / Math.pow(10, w-1-i)) % 10;
      const s = da + db + c;
      c = s >= 10 ? 1 : 0;
      if(c && i > 0) carry[i-1] = '1';
    }
    return {cols:w, rows:[
      {cls:'carry', sign:'', cells:carry},
      {cls:'', sign:'+', cells:padDigits(a,w)},
      {cls:'', sign:'', cells:padDigits(b,w)},
      {cls:'ans', sign:'', cells:padDigits(ans,w)}
    ]};
  }
  function colSub(a,b){
    const ans = a - b;
    const w = Math.max(String(a).length, String(b).length, String(ans).length);
    return {cols:w, rows:[
      {cls:'', sign:'-', cells:padDigits(a,w)},
      {cls:'', sign:'', cells:padDigits(b,w)},
      {cls:'ans', sign:'', cells:padDigits(ans,w)}
    ]};
  }
  function colDec(ta, tb, op){
    const sa = fmt10(ta), sb = fmt10(tb), sr = fmt10(op === '+' ? ta+tb : ta-tb);
    const w = Math.max(sa.length, sb.length, sr.length);
    const pad = (s)=>{
      const o = [];
      for(let i=0;i<w-s.length;i++) o.push('');
      for(let i=0;i<s.length;i++) o.push(s[i]);
      return o;
    };
    return {cols:w, rows:[
      {cls:'', sign:op, cells:pad(sa)},
      {cls:'', sign:'', cells:pad(sb)},
      {cls:'ans', sign:'', cells:pad(sr)}
    ]};
  }
  /* 세로셈에서 한 자리씩 계산하는 값을 만들어 준다 (텍스트와 검산이 같은 수를 쓴다) */
  function placeAdd(a, b){
    const ans = a + b;
    const da = String(a).split('').reverse().map(Number);
    const db = String(b).split('').reverse().map(Number);
    const dr = String(ans).split('').reverse().map(Number);
    const n = Math.max(da.length, db.length);
    const out = [];
    let carry = 0;
    for(let i=0;i<n;i++){
      const x = da[i] || 0, y = db[i] || 0;
      const sum = x + y + carry;
      out.push({i, x, y, cin: carry, sum, digit: sum % 10, cout: sum >= 10 ? 1 : 0});
      carry = sum >= 10 ? 1 : 0;
    }
    if(carry) out.push({i:n, x:0, y:0, cin:carry, sum:carry, digit:carry, cout:0});
    return {ans, places: out};
  }

  /* ---- 문제 객체 ---- */
  function prob(o){
    const answer = o.answer != null ? String(o.answer) : String(o.ansNum);
    let choices = o.choices ? o.choices.slice() : numChoices(o.ansNum, o.choiceOpt);
    if(choices.indexOf(answer) === -1) choices[0] = answer;
    return {
      grade: o.grade,
      kind: o.kind,
      text: o.text,
      prompt: o.prompt || o.text.replace('?', BLANK),
      answer: answer,
      choices: choices,
      blank: !!o.blank,
      hint: o.hint,
      data: o.data || {}
    };
  }

  /* ================= 초1 ================= */
  function g1Add(){
    const a = R(1,9), b = R(1, 10-a), ans = a+b;
    const items = its(a,0).concat(its(b,1));
    return prob({grade:1, kind:'g1_add', ansNum:ans, choiceOpt:{min:1,max:18},
      text:`${a} + ${b} = ?`,
      hint: appleHint(items, `빨간 사과 ${a}개와 파란 사과 ${b}개를 모두 세어 보세요.`),
      data:{a,b,op:'+'}});
  }
  function g1Sub(){
    const a = R(3,10), b = R(1, a-1), ans = a-b;
    const items = its(a,0);
    for(let i=items.length-b;i<items.length;i++) items[i].m = 'crossed';
    return prob({grade:1, kind:'g1_sub', ansNum:ans, choiceOpt:{min:1,max:10},
      text:`${a} - ${b} = ?`,
      hint: appleHint(items, `${a}개 중에서 ${b}개에 X표 했어요. 남은 사과를 세어 보세요.`),
      data:{a,b,op:'-'}});
  }
  function g1Make10(){
    const a = R(1,9), ans = 10-a;
    const items = its(10,0);
    for(let i=0;i<a;i++){ items[i].m = 'known'; items[i].t = 1; }
    return prob({grade:1, kind:'g1_make10', ansNum:ans, choiceOpt:{min:1,max:10},
      text:`${a} + ? = 10`, blank:true,
      hint: appleHint(items, `모두 10개가 되어야 해요. 파란 사과 ${a}개 말고 남은 사과를 세어 보세요.`),
      data:{a,b:ans,op:'make10'}});
  }
  function g1CarryAdd(){
    const a = R(2,9), b = R(Math.max(2, 11-a), 9), ans = a+b;
    const items = its(a,0).concat(its(b,1));

        data:{a,b,c,op:'(-)',inner:s}});
    }
    if(kind === 7){
      const b = R(2,9), q = R(2,12), a = b*q, c = R(2,30), ans = q+c;
      return prob({grade:4, kind:'g4_mixed', ansNum:ans, choiceOpt:{min:3,max:100},

        hint: stepsHint([

        data:{a,b,c,op:'/+',q}});
    }
    const c = R(2,9), q = R(2,12), b = c*q, a = R(2,40), ans = a+q;
    return prob({grade:4, kind:'g4_mixed', ansNum:ans, choiceOpt:{min:3,max:100},
      text:`${a} + ${b} ÷ ${c} = ?`,
      hint: stepsHint([
        {label:'먼저', text:`나눗셈을 먼저 계산해요: ${b} ÷ ${c} = ${q}`},

      data:{a,b,c,op:'+/',q}});

  function g4Decimal(){
    if(Math.random() < 0.5){
      const ta = R(10,88), tb = R(10, 199-ta), ansT = ta+tb;
      return prob({grade:4, kind:'g4_decimal_add', answer: fmt10(ansT),
        choices: decChoices(ansT),
        text:`${fmt10(ta)} + ${fmt10(tb)} = ?`,
        hint: stepsHint([

  ----------------------------------------------------------------*/
  let AC = null;
  function audioCtx(){
    if(!AC){
      try{
        const C = window.AudioContext || window.webkitAudioContext;
        if(C) AC = new C();
      }catch(e){ AC = null; }
    }
    if(AC && AC.state === 'suspended'){ try{ AC.resume(); }catch(e){} }
    return AC;
  }
  function tone(freq, dur, opt){
    if(save.mute) return;
    const c = audioCtx(); if(!c) return;
    opt = opt || {};
    const t0 = c.currentTime + (opt.when||0);
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = opt.type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if(opt.to) o.frequency.exponentialRampToValueAtTime(Math.max(40,opt.to), t0+dur);
    const vol = (opt.vol==null?0.12:opt.vol);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0+dur+0.03);
  }
  function noiseBurst(dur, vol, freq){
    if(save.mute) return;
    const c = audioCtx(); if(!c) return;
    const len = Math.max(1, Math.floor(c.sampleRate*dur));
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++){ d[i] = (Math.random()*2-1) * Math.pow(1-i/len, 2.2); }
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type='bandpass'; f.frequency.value = freq||1200; f.Q.value = 0.9;
    const g = c.createGain(); g.gain.value = vol||0.18;
    src.connect(f); f.connect(g); g.connect(c.destination); src.start();
  }

      const g = c.createLinearGradient(0,-13,0,13);
      g.addColorStop(0,'#fff0a8'); g.addColorStop(.5,'#ffd84f'); g.addColorStop(1,'#f0a800');
      c.fillStyle=g; ell(c,2,0,19,12.5); c.fill();
      c.restore();
      c.strokeStyle='#c98c00'; c.lineWidth=1.3; ell(c,2,0,19,12.5); c.stroke();
      c.fillStyle='rgba(255,255,255,.85)';
      c.beginPath(); c.moveTo(-1,-12); c.quadraticCurveTo(3,-20,10,-11); c.closePath(); c.fill();
      c.fillStyle='#fff'; ell(c,13,-3,3,3); c.fill();
      c.fillStyle='#7a4b00'; ell(c,13.8,-3,1.4,1.4); c.fill();
      c.fillStyle='rgba(255,255,255,.6)'; ell(c,-5,-6,4,2.4); c.fill();
      const tw = 0.5+0.5*Math.sin(phase*2);
      c.globalAlpha = 0.5*tw;
      c.fillStyle='#fff';
      c.beginPath(); c.moveTo(-6,-18); c.lineTo(-4,-14.5); c.lineTo(-1,-13); c.lineTo(-4,-11.5); c.lineTo(-6,-8); c.lineTo(-8,-11.5); c.lineTo(-11,-13); c.lineTo(-8,-14.5); c.closePath(); c.fill();
      c.globalAlpha = 1;
    } else { // chest
      const bob = Math.sin(phase)*0.8;
      c.save();
      c.translate(0,bob);
      c.fillStyle='#8c5a2b';
      c.beginPath();
      c.moveTo(-17,8); c.lineTo(-17,-2); c.quadraticCurveTo(-17,-11,0,-11); c.quadraticCurveTo(17,-11,17,-2); c.lineTo(17,8); c.closePath(); c.fill();
      c.fillStyle='#7a4a20';
      c.beginPath(); c.moveTo(-17,-2); c.quadraticCurveTo(0,-13,17,-2); c.lineTo(17,0); c.quadraticCurveTo(0,-11,-17,0); c.closePath(); c.fill();
      c.strokeStyle='#5d3816'; c.lineWidth=1.4;
      c.beginPath(); c.moveTo(-17,0); c.lineTo(17,0); c.stroke();
      c.strokeStyle=sp.accent; c.lineWidth=2.6;
      c.beginPath(); c.moveTo(-8,-10); c.lineTo(-8,8); c.moveTo(8,-10); c.lineTo(8,8); c.stroke();
      c.fillStyle=sp.accent;

      c.fillStyle='#5d3816'; ell(c,0,1,1.4,1.4); c.fill();
      c.restore();
    }
    c.restore();
    if(alpha!=null) c.globalAlpha = 1;
  }

  /* ---------------------------------------------------------------

  const cv = $('scene'), ctx = cv.getContext('2d');
  let W=390, H=844, DPR=1, SCALE=1, waterY=0, skyH=0;
  const boat = {x:0, y:0};
  let clouds = [], bubbles = [], rays = [];

  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2.5);
    W = cv.clientWidth || window.innerWidth;
    H = cv.clientHeight || window.innerHeight;
    cv.width = Math.round(W*DPR);
    cv.height = Math.round(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    skyH = Math.max(130, Math.round(H*0.34));
    waterY = skyH;
    SCALE = clamp(Math.min(W,H)/430, 0.66, 2.2);
    boat.x = W*0.5;
    boat.y = waterY + 8*SCALE;
    clouds = [];
    const n = clamp(Math.round(W/240), 3, 6);
    for(let i=0;i<n;i++) clouds.push({x:Math.random()*W, y:R(18, Math.max(30, Math.round(skyH*0.55))), s:R(7,14)/10, v:R(3,9), o:0.55+Math.random()*0.35});
    bubbles = [];
    for(let i=0;i<18;i++) bubbles.push({x:Math.random()*W, y:waterY+Math.random()*(H-waterY), r:R(2,5), v:R(6,20), ph:Math.random()*6});
    rays = [];
    for(let i=0;i<4;i++) rays.push({x:W*(0.15+0.22*i), w:W*0.10, a:0.05+Math.random()*0.05});
    if(G.fish.length){
      G.fish.forEach(f=>{ f.y = clamp(f.y, waterY+30, H-90); f.baseY = clamp(f.baseY, waterY+34, H-96); });

  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', ()=>setTimeout(resize, 120));

  /* ---------------------------------------------------------------
     게임 상태
  ----------------------------------------------------------------*/
  const G = {
    state: 'title',        // title | playing | casting | quiz | catching | result
    grade: 1, mode: 'free',
    score: 0, caughtCount: 0, streak: 0,
    timeLeft: 60, elapsed: 0,
    fish: [], hooked: null, castT: 0, castDelay: 0, bob: null,
    quiz: null, wrong: 0, hintOpen: false,
    catchT: 0, catchFrom: null,
    particles: [], floats: [], t: 0,
    dexOpen: false, paused: false
  };

  const FISH_MIN = () => (W < 420 ? 8 : W < 760 ? 10 : 13);
  function spawnFish(initial){
    const sp = pickSpecies();
    const size = sp.len * SCALE * (0.85 + Math.random()*0.3);
    const dir = Math.random()<0.5 ? 1 : -1;
    const margin = size*0.9 + 20;
    const x = initial ? Math.random()*W : (dir>0 ? -margin : W+margin);
    const minY = waterY + 34*SCALE + 16;
    const maxY = H - 96;
    const baseY = R(Math.round(minY), Math.round(Math.max(minY+10, maxY)));
    const f = {
      sp, x, y: baseY, baseY, dir, size,
      speed: R(sp.speed[0], sp.speed[1]) * clamp(SCALE,0.8,1.3),
      phase: Math.random()*Math.PI*2,
      amp: R(6,20)*SCALE,
      wig: 0
    };
    G.fish.push(f);
    return f;
  }
  function ensureFish(){ while(G.fish.length < FISH_MIN()) spawnFish(true); }
  function removeFish(f){
    const i = G.fish.indexOf(f);
    if(i>=0) G.fish.splice(i,1);
  }

  /* ---------------------------------------------------------------
     HUD / 화면
  ----------------------------------------------------------------*/
  const hudCache = {score:-1, caught:-1, streak:-1, sec:-1, mode:'', grade:-1};
  function updateHUD(force){
    if(force || hudCache.score !== G.score){ $('scoreVal').textContent = G.score; hudCache.score = G.score; }
    if(force || hudCache.caught !== G.caughtCount){ $('caughtVal').textContent = G.caughtCount; hudCache.caught = G.caughtCount; }
    if(force || hudCache.streak !== G.streak){
      const comboChip = $('comboChip');
      if(G.streak >= 2){ comboChip.classList.remove('hidden'); $('comboVal').textContent = G.streak; }
      else comboChip.classList.add('hidden');
      hudCache.streak = G.streak;
    }
    const fill = $('timerFill'), txt = $('timerText'), wrap = $('timerWrap');
    if(G.mode === 'timed'){
      wrap.classList.remove('hidden');
      const pct = clamp(G.timeLeft/60, 0, 1);
      fill.style.width = (pct*100).toFixed(1)+'%';
      const sec = Math.ceil(G.timeLeft);
      if(force || hudCache.sec !== sec){
        txt.textContent = sec+'초';
        wrap.classList.toggle('low', G.timeLeft <= 10);
        hudCache.sec = sec;
      }
    } else {
      wrap.classList.add('hidden');
    }
    if(force || hudCache.mode !== G.mode || hudCache.grade !== G.grade){
      $('modePillText').textContent = GRADE_INFO[G.grade].name + ' · ' + (G.mode==='timed'?'60초 도전':'자유 낚시');
      hudCache.mode = G.mode; hudCache.grade = G.grade;
    }
  }
  function setMuteUI(){
    const off = save.mute;
    ['muteBtn','muteBtnStart'].forEach(id=>{
      const b = $(id);
      if(!b) return;
      b.classList.toggle('off', off);
      b.querySelectorAll('.snd-on').forEach(n=>{ n.style.display = off?'none':''; });
      b.querySelectorAll('.snd-off').forEach(n=>{ n.style.display = off?'':'none'; });
      b.setAttribute('aria-label', off?'소리 켜기':'소리 끄기');
    });
  }
  function toast(sp, pts, msg){
    const t = $('toast');
    $('toastText').textContent = msg;
    $('toastPts').textContent = pts!=null ? '+'+pts+'점' : '';
    const tc = $('toastCv').getContext('2d');
    tc.setTransform(1,0,0,1,0,0);
    tc.clearRect(0,0,88,60);
    if(sp) drawFish(tc, sp, 44, 30, 62, 1.2, 1);
    t.classList.add('show');
    clearTimeout(toast._h);
    toast._h = setTimeout(()=>t.classList.remove('show'), 1700);
  }

  /* ---------------------------------------------------------------
     시작 화면

  function refreshStart(){
    document.querySelectorAll('#gradeList .opt').forEach(b=>{
      b.classList.toggle('on', Number(b.dataset.grade) === save.grade);
    });
    document.querySelectorAll('#modeList .opt').forEach(b=>{
      b.classList.toggle('on', b.dataset.mode === save.mode);
    });
    $('gradeDesc').textContent = GRADE_INFO[save.grade].desc;
    const best = save.best[save.mode][save.grade] || 0;
    const gname = GRADE_INFO[save.grade].name;
    const md = save.mode==='timed'?'60초 도전':'자유 낚시';
    $('bestLine').textContent = `${gname} · ${md} 최고 점수 ${best}점`;
    G.grade = save.grade; G.mode = save.mode;

  function showStart(){
    G.state = 'title';
    G.paused = false;
    $('startScreen').classList.remove('hidden');
    $('hud').classList.add('hidden');
    $('bottomBar').classList.add('hidden');
    $('timerWrap').classList.add('hidden');
    $('modePill').classList.add('hidden');

    ['quizWrap','dexWrap','resultWrap'].forEach(id=>$(id).classList.add('hidden'));

  function startGame(){
    audioCtx(); sfx.start();
    G.state = 'playing';

    G.startBest = save.best[G.mode][G.grade] || 0;
    G.timeLeft = 60; G.elapsed = 0;
    G.fish = []; G.hooked = null; G.bob = null; G.quiz = null; G.wrong = 0; G.hintOpen = false;

  ----------------------------------------------------------------*/
  function rodTip(){
    return { x: boat.x + 40*SCALE, y: boat.y - 66*SCALE + Math.sin(G.t*1.6)*2*SCALE };
  }
  function castTo(fish){
    if(G.state !== 'playing' || !fish) return;
    sfx.cast();
    G.state = 'casting';
    G.hooked = fish;
    G.castT = 0;
    G.castDelay = 0;
    G.bob = { x: rodTip().x, y: rodTip().y, tx: fish.x, ty: fish.y, biting:false };
    fish.wig = 0;
  }
  function castButton(){
    if(G.state !== 'playing') return;
    if(!G.fish.length){ ensureFish(); }
    const target = { x: W*0.5, y: waterY + (H-waterY)*0.45 };
    let best = null, bd = 1e9;
    G.fish.forEach(f=>{
      const d = Math.hypot(f.x-target.x, (f.y-target.y)*0.7);
      if(d < bd){ bd = d; best = f; }
    });
    castTo(best);
  }

  /* 문제 글자가 상자보다 길면 글자를 줄여 한 줄에 담는다 */
  function fitQuestion(){
    const q = $('question');
    q.style.fontSize = '';
    let fs = parseFloat(getComputedStyle(q).fontSize) || 30;
    let guard = 0;
    while(q.scrollWidth > q.clientWidth + 1 && fs > 15 && guard++ < 24){
      fs -= 1.5;
      q.style.fontSize = fs + 'px';
    }
  }

  function openQuiz(fish){
    const prob = makeProblemFor(G.grade);
    G.quiz = prob;
    G.state = 'quiz';
    G.wrong = 0;
    G.hintOpen = false;
    G.bob.biting = false;

    $('question').innerHTML = prob.prompt;
    fitQuestion();
    $('feedback').textContent = '';
    $('feedback').className = 'feedback';
    $('hintPanel').classList.add('hidden');
    $('hintBody').innerHTML = '';
    $('hintNote').textContent = '';
    $('quizCard').classList.remove('shake');

    /* 물고기 배지 */
    const bc = $('badgeCv').getContext('2d');
    bc.setTransform(1,0,0,1,0,0);
    bc.clearRect(0,0,152,104);
    const targetLen = 104;
    const s = targetLen / Math.max(30, fish.sp.len);
    drawFish(bc, fish.sp, 76, 52, fish.sp.len*s, 1.4, 1);

    $('quizSay').textContent = `${josa(fish.sp.name,'이','가')} 입질했어요!`;
    $('quizSaySub').textContent = prob.blank
      ? '빈칸에 들어갈 수를 골라 보세요'
      : '답을 고르면 물고기를 잡을 수 있어요';
    $('hintBtnLabel').textContent = prob.hint.type === 'apples' ? '그림으로 세어보기' : '풀이 힌트';

    const ch = $('choices');
    ch.innerHTML = '';
    prob.choices.forEach(v=>{
      const b = document.createElement('button');
      b.className = 'choice';
      b.type = 'button';
      b.textContent = v;
      b.dataset.val = v;
      b.addEventListener('click', ()=>answer(v, b));
      ch.appendChild(b);
    });
    $('quizWrap').classList.remove('hidden');
    sfx.bite();
    $('hintBtn').focus({preventScroll:true});

  function appleSvg(col, dark, crossed){
    const x = crossed ? `<svg class="x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="#5b3a3a" stroke-width="2.6" stroke-linecap="round"/></svg>` : '';
    return `<svg viewBox="0 0 24 24">
        <circle cx="12" cy="14" r="8" fill="${col}" stroke="${dark}" stroke-width="1.6"/>
        <path d="M12 6.5c0-2 1-3.2 3-3.4" fill="none" stroke="#4e9a4e" stroke-width="2" stroke-linecap="round"/>
        <path d="M12.4 6.6c1.6-2 4-2.2 4.8-1.2-1.1 1.7-3.1 2.2-4.8 1.2z" fill="#6fc46f"/>
        <ellipse cx="8.6" cy="11.4" rx="2" ry="1.4" fill="rgba(255,255,255,.5)" transform="rotate(-25 8.6 11.4)"/>
      </svg>` + x;
  }

  function buildColumn(col){
    const tb = document.createElement('table');
    tb.className = 'colcalc';
    col.rows.forEach(r=>{
      const tr = document.createElement('tr');
      if(r.cls) tr.className = r.cls;
      const sc = document.createElement('td');
      sc.className = 'sign';
      sc.textContent = r.sign || '';
      tr.appendChild(sc);
      r.cells.forEach(ch=>{
        const td = document.createElement('td');
        td.textContent = ch;
        tr.appendChild(td);
      });
      tb.appendChild(tr);
    });
    return tb;
  }

  function renderHint(prob){
    const body = $('hintBody');
    body.innerHTML = '';
    if(prob.hint.type === 'apples'){
      const n = prob.hint.items.length;
      const grid = document.createElement('div');
      grid.className = 'hint-grid' + (n > 10 ? ' ten' : '');
      const tones = ['#ff6b6b','#4aa8ff','#5ec86a'];
      prob.hint.items.forEach(it=>{
        const d = document.createElement('span');
        d.className = 'hint-ico' + (it.m==='crossed'?' crossed':'') + (it.m==='known'?' known':'');
        const col = tones[it.t||0];
        const dark = it.t===1?'#1c6fb8':it.t===2?'#2f8b3c':'#c8403a';
        d.innerHTML = appleSvg(col, dark, it.m==='crossed');
        grid.appendChild(d);
      });
      body.appendChild(grid);
    } else {
      if(prob.hint.col) body.appendChild(buildColumn(prob.hint.col));
      const ol = document.createElement('ol');
      ol.className = 'hint-steps';
      prob.hint.steps.forEach((s, i)=>{
        const li = document.createElement('li');
        const num = document.createElement('span');
        num.className = 'n'; num.textContent = String(i+1);
        const st = document.createElement('span');
        st.className = 'st';
        if(s.label){
          const lab = document.createElement('span');
          lab.className = 'lab'; lab.textContent = s.label;
          st.appendChild(lab);
        }
        st.appendChild(document.createTextNode(s.text));
        li.appendChild(num); li.appendChild(st);
        ol.appendChild(li);
      });
      body.appendChild(ol);
    }
    $('hintNote').textContent = prob.hint.note || '';
    $('hintPanel').classList.remove('hidden');
  }

  function answer(val, btn){
    if(G.state !== 'quiz' || !G.quiz) return;
    const prob = G.quiz;
    if(String(val) === String(prob.answer)){
      btn.classList.add('right');
      document.querySelectorAll('.choice').forEach(b=>b.disabled = true);
      $('feedback').className = 'feedback ok';
      $('feedback').textContent = '정답이에요! 물고기를 끌어 올려요!';
      save.solved++; save.correct++; persist();
      G.streak++;
      sfx.right();
      setTimeout(()=>catchStart(), 420);
    } else {
      G.wrong++;
      save.solved++; persist();
      G.streak = 0; updateHUD();
      btn.classList.add('wrong');
      btn.disabled = true;
      $('feedback').className = 'feedback';
      const hintWord = prob.hint.type === 'apples' ? '그림 힌트' : '풀이 힌트';
      $('feedback').textContent = G.wrong >= 2
        ? `앗, 물고기가 힘을 내고 있어요! ${hintWord}를 보며 다시 풀어 볼까요?`
        : '앗, 물고기가 힘을 내고 있어요! 다시 한 번 풀어 볼까요?';
      const card = $('quizCard');
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
      sfx.wrong();
      if(G.wrong >= 2 && !G.hintOpen){
        G.hintOpen = true;
        renderHint(prob);
        setTimeout(()=>{ try{ $('hintPanel').scrollIntoView({block:'nearest', behavior:'smooth'}); }catch(e){} }, 60);
      }
    }
  }

  function catchStart(){
    if(G.state !== 'quiz' || !G.hooked) return;
    const fish = G.hooked;
    G.state = 'catching';
    G.catchT = 0;
    G.catchFrom = { x: fish.x, y: fish.y };
    $('quizWrap').classList.add('hidden');
    sfx.splash();
    splash(fish.x, Math.min(waterY+10, fish.y));
  }

  function finishCatch(){
    const fish = G.hooked;
    if(!fish) return;
    const sp = fish.sp;
    G.streak = Math.max(1, G.streak);
    const comboBonus = G.streak >= 2 ? Math.min(5, G.streak-1) * 10 : 0;
    const pts = sp.pts + comboBonus;
    G.score += pts;
    G.caughtCount++;
    save.caught[sp.id] = (Number(save.caught[sp.id])||0) + 1;
    const bestKey = save.best[G.mode];
    if(G.score > (bestKey[G.grade]||0)){ bestKey[G.grade] = G.score; }
    persist();
    updateHUD();
    toast(sp, pts, `${josa(sp.name,'을','를')} 잡았어요!` + (comboBonus?` (연속 ${G.streak})`:''));
    floatText(boat.x, boat.y - 78*SCALE, '+'+pts, '#ffe07a');
    sparkle(fish.x, waterY);
    removeFish(fish);
    G.hooked = null;
    G.bob = null;
    G.quiz = null;
    ensureFish();
    G.state = 'playing';
  }

  function quitQuiz(){
    if(G.state !== 'quiz') return;
    const fish = G.hooked;
    $('quizWrap').classList.add('hidden');
    G.quiz = null;
    G.hooked = null;
    G.bob = null;
    G.streak = 0;
    updateHUD();
    G.state = 'playing';
    toast(null, null, fish ? `${josa(fish.sp.name,'을','를')} 놓아주었어요` : '다음 물고기를 기다려요');
  }

  function splash(x,y){
    for(let i=0;i<18;i++){
      const a = -Math.PI*0.15 - Math.random()*Math.PI*0.7;
      const sp = 60+Math.random()*150;
      G.particles.push({x, y, vx:Math.cos(a)*sp*(Math.random()<0.5?-1:1)*0.7, vy:Math.sin(a)*sp, life:0, max:0.6+Math.random()*0.3, r:2+Math.random()*3, c:'rgba(220,250,255,', g:520});
    }
  }
  function sparkle(x,y){
    for(let i=0;i<12;i++){
      const a = Math.random()*Math.PI*2;
      const sp = 40+Math.random()*90;
      G.particles.push({x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-40, life:0, max:0.7+Math.random()*0.4, r:2+Math.random()*2.5, c:'rgba(255,225,120,', g:120});
    }
  }
  function floatText(x,y,text,color){
    G.floats.push({x,y,text,color,life:0,max:1.1});
  }

  /* ---------------------------------------------------------------
     도감
  ----------------------------------------------------------------*/
  function openDex(){
    buildDex();
    $('dexWrap').classList.remove('hidden');
    G.dexOpen = true;
  }
  function closeDex(){
    $('dexWrap').classList.add('hidden');
    G.dexOpen = false;
    if(G.state === 'result') $('resultWrap').classList.remove('hidden');
  }
  function buildDex(){
    let total = 0, kinds = 0;
    SPECIES.forEach(s=>{ const c = Number(save.caught[s.id])||0; total += c; if(c>0) kinds++; });
    $('dexTotal').textContent = total;
    $('dexKinds').textContent = kinds+'/'+SPECIES.length;
    $('dexSolved').textContent = save.solved;
    const grid = $('dexGrid');
    grid.innerHTML = '';
    SPECIES.forEach(sp=>{
      const c = Number(save.caught[sp.id])||0;
      const box = document.createElement('div');
      box.className = 'dex-item' + (c>0?'':' locked');
      const cvs = document.createElement('canvas');
      cvs.width = 144; cvs.height = 88;
      const cc = cvs.getContext('2d');
      const s = 76 / Math.max(30, sp.len);
      drawFish(cc, sp, 72, 44, sp.len*s, 1.1, 1);
      const nm = document.createElement('div'); nm.className='nm'; nm.textContent = c>0?sp.name:'???';
      const ct = document.createElement('div'); ct.className='ct';
      ct.textContent = c>0 ? `${c}마리 · ${sp.pts}점` : `아직 못 만났어요`;
      box.appendChild(cvs); box.appendChild(nm); box.appendChild(ct);
      grid.appendChild(box);
    });
    $('dexLegend').textContent = kinds===SPECIES.length
      ? '모든 물고기를 다 모았어요! 정말 대단해요!'
      : '낚시를 하면 저절로 모여요. 희귀한 물고기일수록 점수가 커요!';
  }

  /* ---------------------------------------------------------------
     게임 종료
  ----------------------------------------------------------------*/
  function endGame(reason){
    if(G.state==='result') return;
    const prevBest = (G.startBest != null ? G.startBest : (save.best[G.mode][G.grade] || 0));
    const isNew = G.score > prevBest;
    if(isNew){ save.best[G.mode][G.grade] = G.score; persist(); }
    G.state = 'result';
    G.quiz = null; G.hooked = null; G.bob = null;
    $('quizWrap').classList.add('hidden');
    $('resultTitle').textContent = reason==='time' ? '시간이 다 됐어요!' : '낚시를 마쳤어요!';
    $('resultSub').textContent = `${GRADE_INFO[G.grade].name} · ${G.mode==='timed'?'60초 도전':'자유 낚시'}`;
    $('resultScore').textContent = G.score;
    $('resultCaught').textContent = G.caughtCount;
    $('resultBest').textContent = save.best[G.mode][G.grade] || 0;
    $('newRecord').classList.toggle('hidden', !isNew || G.score===0);
    $('resultWrap').classList.remove('hidden');
    sfx.win();
  }

  /* ---------------------------------------------------------------
     장면 그리기
  ----------------------------------------------------------------*/
  function drawScene(t, dt){
    const sky = ctx.createLinearGradient(0,0,0,skyH+20);
    sky.addColorStop(0,'#9fdcf7');
    sky.addColorStop(0.55,'#c9ecfb');
    sky.addColorStop(1,'#eaf8ff');
    ctx.fillStyle = sky;
    ctx.fillRect(0,0,W,skyH+20);

    const sunX = W*0.82, sunY = skyH*0.30, sunR = 26*SCALE;
    const glow = ctx.createRadialGradient(sunX,sunY,sunR*0.4,sunX,sunY,sunR*3.4);
    glow.addColorStop(0,'rgba(255,236,150,.55)');
    glow.addColorStop(1,'rgba(255,236,150,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(sunX,sunY,sunR*3.4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffe98a';
    ctx.beginPath(); ctx.arc(sunX,sunY,sunR,0,Math.PI*2); ctx.fill();

    clouds.forEach(cl=>{
      cl.x += cl.v*dt;
      if(cl.x > W+90) cl.x = -90;
      drawCloud(cl.x, cl.y, cl.s, cl.o);
    });

    ctx.fillStyle = 'rgba(126,196,168,.75)';
    ctx.beginPath();
    ctx.moveTo(W*0.02, waterY);
    ctx.quadraticCurveTo(W*0.14, waterY-46*SCALE, W*0.30, waterY);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(96,176,148,.65)';
    ctx.beginPath();
    ctx.moveTo(W*0.62, waterY);
    ctx.quadraticCurveTo(W*0.74, waterY-30*SCALE, W*0.92, waterY);
    ctx.closePath(); ctx.fill();

    const sea = ctx.createLinearGradient(0,waterY,0,H);
    sea.addColorStop(0,'#63cfe4');
    sea.addColorStop(0.35,'#2f9dc4');
    sea.addColorStop(1,'#0b4f77');
    ctx.fillStyle = sea;
    ctx.fillRect(0,waterY,W,H-waterY);

    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = 'rgba(255,255,255,.85)';
    ctx.lineWidth = 2.2;
    for(let i=0;i<2;i++){
      ctx.beginPath();
      for(let x=-10;x<=W+10;x+=12){
        const y = waterY + 4 + i*9 + Math.sin(x*0.03 + t*(1.4+i*0.5) + i)*3.2;
        if(x===-10) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
    ctx.restore();

    rays.forEach((r,i)=>{
      const g = ctx.createLinearGradient(0,waterY,0,H*0.85);
      g.addColorStop(0,`rgba(255,255,255,${r.a})`);
      g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      const sway = Math.sin(t*0.6+i)*12;
      ctx.moveTo(r.x+sway, waterY);
      ctx.lineTo(r.x+r.w+sway, waterY);
      ctx.lineTo(r.x+r.w*1.7, H*0.9);
      ctx.lineTo(r.x+r.w*0.4, H*0.9);
      ctx.closePath(); ctx.fill();
    });

    G.fish.forEach(f=>{
      if(f === G.hooked && (G.state==='casting'||G.state==='quiz'||G.state==='catching')) return;
      drawFish(ctx, f.sp, f.x, f.y, f.size, f.phase, f.dir);
      if(f.sp.rare){
        const rr = f.size*1.05;
        const rg = ctx.createRadialGradient(f.x, f.y, f.size*0.25, f.x, f.y, rr);
        rg.addColorStop(0, f.sp.id==='chest' ? 'rgba(255,224,138,.40)' : 'rgba(255,242,176,.38)');
        rg.addColorStop(1, 'rgba(255,240,160,0)');
        ctx.save();
        ctx.globalAlpha = 0.55 + 0.25*Math.sin(t*2.6+f.phase);
        ctx.fillStyle = rg;
        ctx.beginPath(); ctx.arc(f.x, f.y, rr, 0, Math.PI*2); ctx.fill();
        ctx.restore();
      }
    });

    ctx.save();
    bubbles.forEach(b=>{
      b.y -= b.v*dt;
      if(b.y < waterY+6){ b.y = H-10; b.x = Math.random()*W; }
      ctx.globalAlpha = 0.25;
      ctx.strokeStyle = '#eafcff'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(b.x + Math.sin(t+b.ph)*4, b.y, b.r, 0, Math.PI*2); ctx.stroke();
    });
    ctx.restore();

    if(G.state !== 'title') drawBoat(t);
    drawLineAndBobber(t);

    if(G.state==='catching' && G.hooked){
      const tip = rodTip();
      const p = clamp(G.catchT/0.85, 0, 1);
      const e = 1-Math.pow(1-p,2.2);
      const fx = G.catchFrom.x + (tip.x - G.catchFrom.x)*e;
      const fy = G.catchFrom.y + (tip.y - G.catchFrom.y)*e - Math.sin(p*Math.PI)*30;
      const rot = Math.sin(p*Math.PI*3)*0.35;
      ctx.save();
      ctx.translate(fx,fy); ctx.rotate(rot);
      drawFish(ctx, G.hooked.sp, 0, 0, G.hooked.size, p*22, 1);
      ctx.restore();
    }

    G.particles = G.particles.filter(pa=>pa.life < pa.max);
    G.particles.forEach(pa=>{
      pa.life += dt;
      pa.vy += (pa.g||400)*dt;
      pa.x += pa.vx*dt; pa.y += pa.vy*dt;
      const a = 1 - pa.life/pa.max;
      ctx.fillStyle = pa.c + (a*0.95).toFixed(2) + ')';
      ctx.beginPath(); ctx.arc(pa.x, pa.y, pa.r*a+0.6, 0, Math.PI*2); ctx.fill();
    });

    G.floats = G.floats.filter(fl=>fl.life < fl.max);
    G.floats.forEach(fl=>{
      fl.life += dt;
      const a = 1 - fl.life/fl.max;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.font = `900 ${Math.round(26*SCALE)}px system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif`;
      ctx.textAlign = 'center';
      ctx.lineWidth = 5;
      ctx.strokeStyle = 'rgba(11,61,92,.55)';
      ctx.strokeText(fl.text, fl.x, fl.y - fl.life*40);
      ctx.fillStyle = fl.color;
      ctx.fillText(fl.text, fl.x, fl.y - fl.life*40);
      ctx.restore();
    });
  }

  function drawCloud(x,y,s,o){
    ctx.save();
    ctx.globalAlpha = o;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(x, y, 18*s, 0, Math.PI*2);
    ctx.arc(x+20*s, y-8*s, 22*s, 0, Math.PI*2);
    ctx.arc(x+44*s, y, 16*s, 0, Math.PI*2);
    ctx.arc(x+22*s, y+8*s, 20*s, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function drawBoat(t){
    const s = SCALE;
    const bobY = boat.y + Math.sin(t*1.6)*2.2*s;
    ctx.save();
    ctx.translate(boat.x, bobY);
    ctx.scale(s,s);

    ctx.fillStyle = 'rgba(3,45,68,.20)';
    ell(ctx, 0, 12, 48, 9); ctx.fill();

    ctx.fillStyle = '#c85c37';
    ctx.beginPath();
    ctx.moveTo(-44,-2);
    ctx.quadraticCurveTo(0,26,44,-2);
    ctx.quadraticCurveTo(20,4,0,4);
    ctx.quadraticCurveTo(-20,4,-44,-2);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#f3f0e4';
    ctx.beginPath();
    ctx.moveTo(-40,-2); ctx.lineTo(40,-2); ctx.lineTo(36,-11); ctx.lineTo(-36,-11); ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#b04b2b'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-40,-2); ctx.quadraticCurveTo(0,20,40,-2); ctx.stroke();
    ctx.fillStyle = '#c85c37';
    ctx.beginPath(); ctx.moveTo(-38,-8); ctx.lineTo(38,-8); ctx.lineTo(36,-4); ctx.lineTo(-36,-4); ctx.closePath(); ctx.fill();

    const armWag = Math.sin(t*1.6)*1.4;
    ctx.fillStyle = '#3a6ea5';
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-13,-30,26,22,8) : ctx.rect(-13,-30,26,22); ctx.fill();
    ctx.fillStyle = '#ffd9b8';
    ell(ctx,0,-38,12,12); ctx.fill();
    ctx.fillStyle = '#4a3122';
    ctx.beginPath(); ctx.arc(0,-40,12,Math.PI*1.05,Math.PI*1.95); ctx.fill();
    ctx.fillStyle = '#f0c86a';
    ctx.beginPath(); ctx.ellipse(0,-47,19,5.5,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0,-52,10,8,0,Math.PI,Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#d9a83f'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.ellipse(0,-47,19,5.5,0,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle = '#2b1c12';
    ctx.beginPath(); ctx.arc(-4,-38,1.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(4,-38,1.5,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#e08a6a'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0,-34.5,3,0.2*Math.PI,0.8*Math.PI); ctx.stroke();
    ctx.strokeStyle = '#ffd9b8'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(9,-27); ctx.lineTo(20+armWag,-33); ctx.stroke();
    ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 3.2; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(16,-31); ctx.quadraticCurveTo(30,-48,40,-66); ctx.stroke();
    ctx.restore();
  }

  function drawLineAndBobber(t){
    const tip = rodTip();
    let bx = tip.x + 4*SCALE, by = tip.y + 16*SCALE;
    if(G.bob){
      bx = G.bob.x; by = G.bob.y;
    }
    if(G.state==='casting' || G.state==='quiz' || G.state==='catching'){
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,.9)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(tip.x, tip.y);
      const mx = (tip.x+bx)/2 + 6;
      ctx.quadraticCurveTo(mx, (tip.y+by)/2, bx, by);
      ctx.stroke();
      ctx.restore();
    } else if(G.state==='playing'){
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,.45)';
      ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.moveTo(tip.x, tip.y); ctx.lineTo(tip.x+3, tip.y+14); ctx.stroke();
      ctx.restore();
    }
    if(G.bob && (G.state==='casting'||G.state==='quiz'||G.state==='catching')){
      const wob = G.bob.biting ? Math.sin(t*24)*3 : Math.sin(t*3)*1.2;
      ctx.save();
      ctx.translate(bx + (G.state==='casting'? wob*0.4 : wob), by);
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5;
      ctx.fillStyle = '#ff5a4d';
      ctx.beginPath(); ctx.arc(0,-6*SCALE,6*SCALE,Math.PI,0); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(0,-6*SCALE,6*SCALE,0,Math.PI); ctx.fill();
      ctx.strokeStyle = '#e0453c'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(0,-6*SCALE,6*SCALE,0,Math.PI*2); ctx.stroke();
      ctx.strokeStyle = '#ffd24a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0,-12*SCALE); ctx.lineTo(0,-18*SCALE); ctx.stroke();
      ctx.restore();
      if(G.bob.biting){
        ctx.save();
        ctx.font = `900 ${Math.round(22*SCALE)}px system-ui, sans-serif`;
        ctx.fillStyle = '#fff';
        ctx.strokeStyle = '#e0453c';
        ctx.lineWidth = 4;
        ctx.strokeText('!', bx+12*SCALE, by-20*SCALE);
        ctx.fillText('!', bx+12*SCALE, by-20*SCALE);
        ctx.restore();
      }
    }
  }

  /* ---------------------------------------------------------------
     업데이트
  ----------------------------------------------------------------*/
  let last = performance.now();
  function frame(now){
    let dt = (now - last)/1000;
    last = now;
    dt = clamp(dt, 0, 0.05);
    G.t += dt;
    const t = G.t;

    const modalPause = G.dexOpen || G.state==='result' || G.state==='title';

    if(!modalPause){
      G.fish.forEach(f=>{
        if(f === G.hooked && (G.state==='casting'||G.state==='quiz'||G.state==='catching')){
          f.phase += dt*10;
          return;
        }
        f.x += f.dir * f.speed * dt;
        if(f.dir > 0 && f.x > W + f.size*1.2) f.x = -f.size*1.2;
        if(f.dir < 0 && f.x < -f.size*1.2) f.x = W + f.size*1.2;
        f.y = clamp(f.baseY + Math.sin(t*1.1 + f.phase*0.5)*f.amp, waterY+30*SCALE+8, H-94);
        f.phase += dt*(3.2 + f.speed*0.04);
      });

      if(G.state === 'casting' && G.hooked){
        G.castT += dt*2.4;
        const tip = rodTip();
        const p = clamp(G.castT, 0, 1);
        const e = 1-Math.pow(1-p,1.8);
        G.bob.x = tip.x + (G.hooked.x - tip.x)*e;
        G.bob.y = tip.y + (G.hooked.y - tip.y)*e;
        if(p >= 1){
          G.bob.x = G.hooked.x; G.bob.y = G.hooked.y;
          G.bob.biting = true;
          if(!G.bob._bit){ G.bob._bit = true; sfx.bite(); splash(G.bob.x, waterY+6); }
          G.castDelay += dt;
          if(G.castDelay > 0.55){ openQuiz(G.hooked); }
        }
      }
      if(G.state === 'catching'){
        G.catchT += dt;
        if(G.catchT > 0.85){ finishCatch(); }
      }
      if(G.state === 'quiz' && G.bob){ G.bob.biting = true; }

      if(G.mode === 'timed' && (G.state==='playing' || G.state==='casting' || G.state==='quiz')){
        G.timeLeft -= dt;
        if(G.timeLeft <= 0){
          G.timeLeft = 0;
          updateHUD();
          endGame('time');
        } else {
          updateHUD();
        }
      }
    }

    drawScene(t, dt);
    requestAnimationFrame(frame);
  }

  /* ---------------------------------------------------------------
     입력
  ----------------------------------------------------------------*/
  function canvasPoint(ev){
    const r = cv.getBoundingClientRect();
    const p = ev.touches && ev.touches[0] ? ev.touches[0] : ev;
    return { x: (p.clientX - r.left) * (W/r.width), y: (p.clientY - r.top) * (H/r.height) };
  }
  function fishAt(x,y){
    let best = null, bd = 1e9;
    G.fish.forEach(f=>{
      if(f === G.hooked) return;
      const rad = Math.max(f.size*0.55, 26);
      const d = Math.hypot(f.x-x, (f.y-y)*1.15);
      if(d < rad && d < bd){ bd = d; best = f; }
    });
    return best;
  }
  cv.addEventListener('pointerdown', (ev)=>{
    audioCtx();
    if(G.state !== 'playing' || G.dexOpen) return;
    const p = canvasPoint(ev);
    if(p.y < waterY - 10) return;
    const f = fishAt(p.x, p.y);
    if(f) castTo(f);
  }, {passive:true});

  /* ---------------------------------------------------------------
     UI 바인딩
  ----------------------------------------------------------------*/
  $('gradeList').addEventListener('click', (ev)=>{
    const b = ev.target.closest('.opt'); if(!b) return;
    save.grade = Number(b.dataset.grade); persist(); refreshStart(); sfx.tap();
  });
  $('modeList').addEventListener('click', (ev)=>{
    const b = ev.target.closest('.opt'); if(!b) return;
    save.mode = b.dataset.mode; persist(); refreshStart(); sfx.tap();
  });
  $('startBtn').addEventListener('click', startGame);
  $('castBtn').addEventListener('click', ()=>{ audioCtx(); castButton(); });
  $('dexBtn').addEventListener('click', openDex);
  $('dexBtnStart').addEventListener('click', openDex);
  $('dexClose').addEventListener('click', closeDex);
  $('dexWrap').addEventListener('click', (ev)=>{ if(ev.target === $('dexWrap')) closeDex(); });
  $('hintBtn').addEventListener('click', ()=>{
    if(G.state !== 'quiz' || !G.quiz) return;
    G.hintOpen = !G.hintOpen;
    if(G.hintOpen){ renderHint(G.quiz); try{ $('hintPanel').scrollIntoView({block:'nearest'}); }catch(e){} }
    else $('hintPanel').classList.add('hidden');
    sfx.tap();
  });
  $('quitQuiz').addEventListener('click', quitQuiz);
  $('homeBtn').addEventListener('click', ()=>{
    if(G.state==='quiz'){ quitQuiz(); }
    showStart();
  });
  $('retryBtn').addEventListener('click', ()=>{ startGame(); });
  $('resultDexBtn').addEventListener('click', ()=>{ $('resultWrap').classList.add('hidden'); openDex(); });
  $('resultHomeBtn').addEventListener('click', showStart);
  ['muteBtn','muteBtnStart'].forEach(id=>{
    $(id).addEventListener('click', ()=>{
      save.mute = !save.mute; persist(); setMuteUI();
      if(!save.mute) sfx.tap();
    });
  });
  document.addEventListener('gesturestart', (e)=>e.preventDefault());
  document.addEventListener('dblclick', (e)=>e.preventDefault(), {passive:false});
  window.addEventListener('keydown', (ev)=>{
    if(ev.key==='Escape'){
      if(G.dexOpen) closeDex();
      else if(G.state==='quiz') quitQuiz();
    }
    if(G.state==='playing' && (ev.key===' '||ev.key==='Enter')){ ev.preventDefault(); castButton(); }
  });

  /* ---------------------------------------------------------------
     시작
  ----------------------------------------------------------------*/
  loadSave();
  G.grade = save.grade; G.mode = save.mode;
  setMuteUI();
  refreshStart();
  resize();
  for(let i=0;i<FISH_MIN();i++) spawnFish(true);
  updateHUD();
  requestAnimationFrame(frame);

  /* 테스트/디버그용 읽기 전용 훅 */
  window.__mf = {
    grades: ()=> [1,2,3,4],
    gen: (grade, n)=>{
      const out = [];
      const cnt = n||1;
      for(let i=0;i<cnt;i++) out.push(makeProblemFor(grade));
      return out;
    },
    problem: (grade)=> makeProblemFor(grade),
    state: ()=> G.state,
    quiz: ()=> G.quiz,
    grade: ()=> G.grade,
    mode: ()=> G.mode,
    score: ()=> G.score,
    caught: ()=> G.caughtCount,
    fishCount: ()=> G.fish.length,
    hintType: ()=> G.quiz ? G.quiz.hint.type : null,
    save: ()=> JSON.parse(JSON.stringify(save)),
    cast: ()=> castButton(),
    selectGrade: (g)=>{ save.grade=Number(g); persist(); refreshStart(); },
    selectMode: (m)=>{ save.mode=m; persist(); refreshStart(); },
    chooseCorrect: ()=>{
      if(!G.quiz) return false;
      const b = Array.prototype.slice.call(document.querySelectorAll('.choice')).filter(x=>x.dataset.val === String(G.quiz.answer))[0];
      if(b){ b.click(); return true; }
      return false;
    }
  };
})();
</script>
</body>
